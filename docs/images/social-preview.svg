<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- GitHub social preview: the Dusk wallpaper gradient with the Sunset logo (D110). Render with headless Chrome at 1280x640 (it loads Outfit from the app) -->
  <style>@font-face { font-family: Outfit; src: url(../../launcher/app/src/main/res/font/outfit.ttf); font-weight: 100 900; }</style>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1533"/>
      <stop offset="0.55" stop-color="#7E3459"/>
      <stop offset="1" stop-color="#D9714C"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4577F"/>
      <stop offset="0.5" stop-color="#F47D56"/>
      <stop offset="1" stop-color="#FFBE8E"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#dusk)"/>
  <rect x="120" y="230" width="180" height="180" rx="40" fill="url(#sunset)"/>
  <path fill="#FFFFFF" transform="translate(165 275) scale(3.75)" d="M10,20v-6h4v6h5v-8h3L12,3 2,12h3v8z"/>
  <text x="350" y="318" font-family="Outfit" font-weight="500" font-size="76" fill="#FFFFFF">Just My TV Launcher</text>
  <text x="352" y="384" font-family="Outfit" font-weight="400" font-size="36" fill="#FFD3BC">A fast home screen for Android TV</text>
</svg>
